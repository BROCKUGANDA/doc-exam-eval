name: validate

# The submission's central claim is that anyone can reproduce the proof from a clean
# environment. CI runs exactly what a judge would run, on a fresh runner, so that claim is
# checked continuously rather than asserted in a README.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  benchmark-proof:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # No API keys are provided here on purpose: if anything in the proof path needed a
      # credential, this step would fail and we would know the benchmark is not reproducible.
      - name: Prove engine, tasks and graders
        run: python run_eval.py --validate

      - name: Run the test suite
        run: python -m pytest tests -q

      - name: Regenerate task artefacts and confirm determinism
        run: |
          python run_eval.py --write-tasks
          python run_eval.py --review-sheet
          git add --intent-to-add benchmark/tasks docs/expert-review.md
          if git diff --quiet --exit-code -- benchmark/tasks; then
            echo "task artefacts are byte-identical to the committed ones"
          else
            echo "::error::generated task artefacts drifted from the committed ones"
            git diff -- benchmark/tasks | head -60
            exit 1
          fi

      - name: Confirm no credentials are present in the tree
        run: |
          if grep -rInE "sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,}" \
               --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules . ; then
            echo "::error::credential-shaped string found in the repository"
            exit 1
          fi
          test ! -f .env

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image could not be built on the author's Windows machine (Docker Desktop was
      # not running), so this job is the actual evidence that the container path works.
      - name: Build the evaluation image
        run: docker build -t docx-eval .
      - name: Run the proof inside the container
        run: docker run --rm docx-eval python run_eval.py --validate
