[pytest]
testpaths = benchmark tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning
    ; Third-party internals are not ours to keep warning-free; the guard stays for our code.
    ignore:The anyio\.abc\..* alias is deprecated:DeprecationWarning
    ignore:ast\.Num is deprecated:DeprecationWarning
